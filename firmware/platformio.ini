; LumosAir sensor nodes — ESP32 (Arduino framework)
;
; Two nodes share this firmware:
;   pio run -e laser -t upload     # node at the laser / cyclone (5 sensors + BME280)
;   pio run -e fan   -t upload     # node at the fan inlet (1 sensor)
;
; Before building: copy include/lumosair_config.example.h to include/lumosair_config.h and fill in Wi-Fi.

[platformio]
default_envs = laser

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags = -Wall

[env:laser]
build_flags = ${env.build_flags} -DNODE_LASER

[env:fan]
build_flags = ${env.build_flags} -DNODE_FAN

; Over-the-air updates once a node is mounted (uncomment and set the IP):
; upload_protocol = espota
; upload_port = 192.168.1.50
